<!-- Written with AI assistance (Claude). -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Marswalk planner</title>
  </head>
  <body>
    <div id="map"></div>
    <header id="header">
      <div class="title">Phobos Phantoms · Marswalk planner · Jezero western delta</div>
      <div class="sub" id="grid-size"></div>
      <div id="view-toggle" class="view-toggle" role="group" aria-label="Map view">
        <button type="button" data-view="2d" aria-pressed="true" title="Map view (key 2)">2D<span class="long"> map</span></button>
        <button type="button" data-view="3d" aria-pressed="false" title="Terrain view (key 3)">3D<span class="long"> terrain</span></button>
        <button type="button" id="sound-toggle" class="sound-chip" aria-pressed="false" title="Mars wind and UI sounds (key M)"><span class="sound-label">Sound off</span></button>
        <button type="button" class="keys-chip" title="Keyboard shortcuts" aria-label="Keyboard shortcuts (?)" onclick="document.dispatchEvent(new KeyboardEvent('keydown',{key:'?',bubbles:true}))"><kbd>?</kbd> Keys</button>
      </div>
    </header>
    <div id="sample-badge" hidden>SAMPLE DATA — synthetic test files, not NASA data</div>
    <div id="hud" hidden aria-live="off"></div>
    <div id="error" hidden></div>
    <aside id="panel">
      <p id="route-source" class="route-source" hidden></p>
      <section id="route-summary"><h2>Route</h2><p class="muted">Loading…</p></section>
      <section id="compare" hidden></section>
      <section id="readout-section" hidden>
        <h2>At this point on the route</h2>
        <input id="point-slider" type="range" min="0" max="0" value="0" aria-label="Move along the route" />
        <div id="readout"></div>
      </section>
      <section id="profile" hidden></section>
      <section id="window"></section>
      <section id="live"></section>
      <section>
        <h2>Science stops</h2>
        <div id="stops"></div>
      </section>
      <section id="proof"></section>
      <section>
        <h2>Assumptions</h2>
        <ul id="assumptions"></ul>
      </section>
      <section id="sources"></section>
      <section id="tools"><h2>Briefing & downloads</h2><div id="briefing-tools"></div><div id="download-tools"></div></section>
    </aside>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
