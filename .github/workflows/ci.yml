# Written with AI assistance (Claude).
name: checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install Python packages (base + dev, exactly as in uv.lock)
        run: uv sync --locked
      - name: Validate contracts
        run: uv run python contracts/validate.py
      - name: Tests (pass if none yet)
        run: uv run pytest -q || [ $? -eq 5 ]
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JS tests (frame helpers)
        run: node --test pipeline/frame.test.mjs
      - name: No files over 50 MB
        run: |
          big=$(find . -path ./.git -prune -o -type f -size +50M -print)
          if [ -n "$big" ]; then echo "Too big for git, use the shared drive:"; echo "$big"; exit 1; fi